<div id="contenedor" class="form">
    <form (ngSubmit)="submit()" #userForm="ngForm">

        <div class="form-group">
            <label for="user">Nombre:</label>
            <input type="text" id="user" [(ngModel)]="user.name" name="name" #name="ngModel" required>

            @if (name.invalid && name.dirty) {
            <div class="alert">
                @if (name.errors?.['required']) {
                <div>Campo requerido</div>
                }
            </div>
            }
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" [(ngModel)]="user.password" name="password" #password="ngModel"
                required minlength="6">

            @if (password.invalid && password.dirty) {
            <div class="alert">
                @if (password.errors?.['required']) {
                <div>Campo requerido</div>
                }
                @if (password.errors?.['minlength']) {
                <div>Mínimo 6 caracteres</div>
                }
            </div>
            }
        </div>

        <button type="submit" [disabled]="!userForm.form.valid">
            Entrar
        </button>

    </form>
</div>
